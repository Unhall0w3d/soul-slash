# Additive installed endpoint. Trial and historical conversations stay separate.
---
version: 1.3.1
cache: false
endpoints:
  custom:
  - name: SoulRoster
    apiKey: "${SOUL_CONTINUITY_API_KEY}"
    baseURL: http://127.0.0.1:8096/v1
    models:
      default:
      - gpt-oss-20b
      - gemma-4-26b-a4b
      - qwen3.8-27b
      fetch: false
    headers:
      X-Soul-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
    titleConvo: false
    summarize: false
    modelDisplayLabel: Soul members
    addParams:
      temperature: 1.0
      topP: 0.95
      maxTokens: 2048
      timeout: 240000
      maxRetries: 0
      streamUsage: false
    dropParams:
    - user
    - "n"
    - stop
    - frequency_penalty
    - presence_penalty
    - logprobs
    - top_logprobs
    - logit_bias
    - seed
    - response_format
    - tools
    - tool_choice
    - parallel_tool_calls
modelSpecs:
  list:
  - name: soul-member-gpt-oss
    label: Soul — GPT-OSS
    description: Active member. Approved shared and member-scoped memory; archived
      conversation history and replay protection. Four-minute idle unload, native
      low reasoning; text only, no tools.
    preset:
      endpoint: SoulRoster
      model: gpt-oss-20b
      promptPrefix: ''
      maxContextTokens: 65536
  - name: soul-member-gemma
    label: Soul — Gemma
    description: Active member. Approved shared and member-scoped memory; archived
      conversation history and replay protection. Four-minute idle unload, thinking
      off; text only, no tools.
    preset:
      endpoint: SoulRoster
      model: gemma-4-26b-a4b
      promptPrefix: ''
      maxContextTokens: 65536
  - name: soul-member-qwen38
    label: Soul — Qwen 3.8 (optional)
    description: Optional active member. Approved shared and member-scoped memory;
      archived history and replay protection. Four-minute idle unload, thinking off;
      text only, no tools. Verify source claims.
    preset:
      endpoint: SoulRoster
      model: qwen3.8-27b
      promptPrefix: ''
      maxContextTokens: 65536
