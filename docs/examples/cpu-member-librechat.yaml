---
version: 1.3.1
cache: false
endpoints:
  custom:
  - name: SoulCPU
    apiKey: "${SOUL_CONTINUITY_API_KEY}"
    baseURL: http://127.0.0.1:8097/v1
    models:
      default: [gemma-4-e4b-cpu]
      fetch: false
    headers:
      X-Soul-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
    titleConvo: false
    summarize: false
    modelDisplayLabel: Soul CPU
    addParams:
      temperature: 1.0
      topP: 0.95
      maxTokens: 1024
      timeout: 150000
      maxRetries: 0
      streamUsage: false
    dropParams: [user, n, stop, frequency_penalty, presence_penalty, logprobs, top_logprobs, logit_bias, seed, response_format, tools, tool_choice, parallel_tool_calls]
modelSpecs:
  list:
  - name: soul-member-gemma-cpu
    label: Soul — Gemma CPU
    description: CPU chat (4096-token context, up to 1024 output tokens) and scoped read-only tools. Start a new conversation when full or after cancellation. Type /task help for explicit task add/list/cancel commands. Pending tasks are recorded, not scheduled. Explicit /task preview and /task run can hand a reviewed task to a GPU roster member. No automatic GPU dispatch or shared-memory import. Stays in RAM after first use until stopped or a resource guard requires unloading.
    preset:
      endpoint: SoulCPU
      model: gemma-4-e4b-cpu
      promptPrefix: ''
      maxContextTokens: 4096
