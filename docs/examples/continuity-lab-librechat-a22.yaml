# Staged example only. Merge these entries into the existing configuration;
# do not replace its other endpoints, authentication, or stored data settings.
# No credential is supplied here. Local enrollment is a separate activation step.
version: 1.3.1
cache: false
endpoints:
  custom:
    - name: SoulContinuity
      apiKey: '${SOUL_CONTINUITY_API_KEY}'
      baseURL: 'http://127.0.0.1:8094/v1'
      models:
        default: ['soul-continuity-qwen']
        fetch: false
      headers:
        X-Soul-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      titleConvo: false
      summarize: false
      modelDisplayLabel: 'Soul Continuity — experimental, bounded context'
      # These are installed-client constructor parameters, not extra JSON fields.
      addParams:
        temperature: 0.6
        topP: 0.95
        maxTokens: 768
        timeout: 480000
        maxRetries: 0
        streamUsage: false
      dropParams:
        - user
        - n
        - stop
        - frequency_penalty
        - presence_penalty
        - logprobs
        - top_logprobs
        - logit_bias
        - seed
        - response_format
        - tools
        - tool_choice
        - parallel_tool_calls
modelSpecs:
  list:
    - name: soul-continuity-a22
      label: 'Soul Continuity (A22 trial)'
      description: 'Text only. Up to three recent exchanges reach Qwen; no tools or automatic memory. New chats only; retries replay, edits refuse.'
      preset:
        endpoint: SoulContinuity
        model: soul-continuity-qwen
        promptPrefix: ''
        # Client-side history shipping budget, NOT the model's 4096-token window.
        # The gateway verifies full history and the existing runtime bounds input.
        maxContextTokens: 65536
