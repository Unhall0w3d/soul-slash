# Staged trial entries. Merge only; existing endpoints and Qwen chats stay intact.
version: 1.3.1
cache: false
endpoints:
  custom:
    - name: SoulRosterTrial
      apiKey: '${SOUL_CONTINUITY_API_KEY}'
      baseURL: 'http://127.0.0.1:8095/v1'
      models:
        default: ['gpt-oss-20b', 'gemma-4-26b-a4b']
        fetch: false
      headers:
        X-Soul-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
      titleConvo: false
      summarize: false
      modelDisplayLabel: 'Soul roster — foreground trial'
      addParams:
        temperature: 1.0
        topP: 0.95
        maxTokens: 2048
        timeout: 240000
        maxRetries: 0
        streamUsage: false
      dropParams:
        - user
        - n
        - stop
        - frequency_penalty
        - presence_penalty
        - logprobs
        - top_logprobs
        - logit_bias
        - seed
        - response_format
        - tools
        - tool_choice
        - parallel_tool_calls
modelSpecs:
  list:
    - name: soul-roster-gpt-oss-trial
      label: 'Soul GPT-OSS (roster trial)'
      description: 'New chats only. Foreground trial; unloads after every reply. Buffered final text, three recent exchanges, no tools or memory import.'
      preset:
        endpoint: SoulRosterTrial
        model: gpt-oss-20b
        promptPrefix: ''
        maxContextTokens: 65536
    - name: soul-roster-gemma-trial
      label: 'Soul Gemma (roster trial)'
      description: 'New chats only. Thinking off; unloads after every reply. Buffered final text, three recent exchanges, no tools or memory import.'
      preset:
        endpoint: SoulRosterTrial
        model: gemma-4-26b-a4b
        promptPrefix: ''
        maxContextTokens: 65536
