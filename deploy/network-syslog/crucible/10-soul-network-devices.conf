# Fixed-source private-LAN receiver for approved network appliances.
module(load="imudp" threads="1")
template(name="SoulNetworkLine" type="string" string="%timereported:::date-rfc3339% %fromhost-ip% %syslogtag%%msg%\n")
ruleset(name="soul_network_devices" queue.type="FixedArray" queue.size="10000" queue.workerThreads="1" queue.dequeueBatchSize="128") {
  if $fromhost-ip == '192.168.124.10' then {
    action(type="omfile" file="/var/log/network-devices/lattice.log" template="SoulNetworkLine" createDirs="on" dirCreateMode="0750" fileCreateMode="0640")
    stop
  }
  if $fromhost-ip == '192.168.124.11' then {
    action(type="omfile" file="/var/log/network-devices/loom.log" template="SoulNetworkLine" createDirs="on" dirCreateMode="0750" fileCreateMode="0640")
    stop
  }
  stop
}
input(type="imudp" address="192.168.124.2" port="514" ruleset="soul_network_devices" name="soul-network-devices" rateLimit.interval="5" rateLimit.burst="500")
