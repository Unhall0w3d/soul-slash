groups:
  - name: soul-fleet-bounded
    interval: 30s
    rules:
      - alert: SoulEndpointStale
        expr: max by (device_id, role) (time() - timestamp(node_uname_info)) > 180
        for: 2m
        labels: {severity: attention, scope: fleet}
        annotations: {summary: "Fleet endpoint metrics are stale"}
      - alert: SoulRootFilesystemPressure
        expr: max by (device_id, role) (100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"})) > 85
        for: 15m
        labels: {severity: attention, scope: fleet}
        annotations: {summary: "Root filesystem use is above 85 percent"}
      - alert: SoulMemoryPressure
        expr: max by (device_id, role) (100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 92
        for: 15m
        labels: {severity: attention, scope: fleet}
        annotations: {summary: "Memory use is above 92 percent"}
      - alert: SoulHostNetworkErrors
        expr: sum by (device_id, role) (rate(node_network_receive_errs_total{device!~"lo|veth.*|docker.*|br-.*|virbr.*|tailscale.*"}[5m]) + rate(node_network_transmit_errs_total{device!~"lo|veth.*|docker.*|br-.*|virbr.*|tailscale.*"}[5m])) > 0
        for: 10m
        labels: {severity: attention, scope: fleet}
        annotations: {summary: "A fleet endpoint is reporting network errors"}
      - alert: SoulSwitchScrapeUnavailable
        expr: up{job="switch_interfaces"} == 0
        for: 5m
        labels: {severity: attention, scope: network}
        annotations: {summary: "A reviewed switch SNMP target is unavailable"}
      - alert: SoulSwitchPortErrors
        expr: sum by (device_id, ifName) (rate(ifInErrors[5m]) + rate(ifOutErrors[5m])) > 0
        for: 10m
        labels: {severity: attention, scope: network}
        annotations: {summary: "A reviewed switch interface is accumulating errors"}
