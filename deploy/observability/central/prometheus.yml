global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/soul-fleet-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: switch_interfaces
    metrics_path: /snmp
    params:
      module: [if_mib]
    file_sd_configs:
      - files: [/etc/prometheus/soul-switch-targets.json]
        refresh_interval: 5m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [snmp_auth]
        target_label: __param_auth
      - source_labels: [device_id]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9116
