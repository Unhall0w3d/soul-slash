---
skills:
  system.status:
    path: Soul/skills/system/status.rb
    language: ruby
    description: Read-only local system and Soul runtime status check.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: json
    verifier: schema_basic
  project.timeline.inspect:
    internal_handler: project_tracker
    category: project_coordination
    status: available
    description: Read the shared owner-local implementation ledger, including explicit horizons, states, priorities, and review criteria.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: application_envelope
    verifier: project_timeline_a1
  project.timeline.update:
    internal_handler: project_tracker
    category: project_coordination
    status: available
    description: Create or revise one explicitly named implementation-ledger item through the Dashboard editor or an unmistakable timeline-item Chat command.
    risk: write_local_state
    requires_approval: false
    writes_files: true
    expected_output: application_envelope
    verifier: project_timeline_a1
  dashboard.capabilities.inspect:
    internal_handler: dashboard_capability_guide
    category: project_coordination
    status: available
    description: Explain which Dashboard surfaces currently have bounded conversational mappings, their required inputs, Core needs, and retained human gates without invoking them.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: conversation_result
    verifier: dashboard_capability_guide_a1
  dashboard.invocations.inspect:
    internal_handler: invocation_catalog
    category: project_coordination
    status: available
    description: Read the curated invocation guide, including required inputs, Core needs, approval behavior, outputs, and retained authority boundaries, without invoking anything.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: application_envelope
    verifier: invocation_catalog_a1
  chats.clear:
    path: Soul/skills/chats/clear.rb
    language: ruby
    description: Preview and archive active conversations by exact title or all conversations so they leave the active list without deleting transcripts.
    risk: write_local_state
    requires_approval: true
    confirmation_phrase: CLEAR_CONVERSATIONS
    writes_files: true
    expected_output: json
    verifier: schema_basic
  chats.forget:
    path: Soul/skills/chats/forget.rb
    language: ruby
    description: Permanently delete one exact local conversation and logically forget shared memories derived from it.
    risk: permanent_delete
    requires_approval: true
    confirmation_phrase: DELETE_AND_FORGET_CONVERSATION
    writes_files: true
    expected_output: json
    verifier: schema_basic
  creative.music_production:
    internal_handler: conversation_creative_workflow
    category: creative_studios
    status: available
    description: Gather a music brief through chat, preserve user-required decisions, generate and review candidates, translate recorded revision feedback, and prepare exact kept-song export or rejected-candidate deletion gates.
    risk: write_local_state_and_bounded_generation
    requires_approval: true
    confirmation_phrase: START_CREATIVE_WORKFLOW
    writes_files: true
    expected_output: application_envelope
    verifier: conversation_creative_workflow
    required_core: music
    core_transition_authority: exact_action_click
  creative.visual_production:
    internal_handler: conversation_creative_workflow
    category: creative_studios
    status: available
    description: Gather or draft a visual brief through chat, generate and review a local still, translate a recorded revise review into one guided edit, and continue a kept visual context into exact native text-to-video generation or a review-led native revision.
    risk: write_local_state_and_bounded_generation
    requires_approval: true
    confirmation_phrase: START_CREATIVE_WORKFLOW
    writes_files: true
    expected_output: application_envelope
    verifier: conversation_creative_workflow
    required_core: amd-free
    core_transition_authority: exact_action_click
  creative.companion_production:
    internal_handler: conversation_creative_workflow
    category: creative_studios
    status: available
    description: Coordinate supported reviewed music, still, and native-motion work through exact generation, lineage binding, static presentation when needed, full-duration rendering, kept-song export, and local upload-package export; image-guided motion, destructive visual actions, and external publication retain their dedicated boundaries.
    risk: write_local_state_and_bounded_generation
    requires_approval: true
    confirmation_phrase: START_CREATIVE_WORKFLOW
    writes_files: true
    expected_output: application_envelope
    verifier: conversation_creative_workflow
    required_core: dynamic_by_generation_operation
    core_transition_authority: exact_action_click
  cores.activate:
    internal_handler: core_orchestration
    category: runtime_control
    status: available
    description: Preview and activate one configured Core without rebooting while preserving active-work, lease, digest, and exact click-approval checks.
    risk: runtime_mutation
    requires_approval: true
    writes_files: true
    expected_output: application_envelope
    verifier: core_orchestration
  knowledge.vault.search:
    internal_handler: knowledge_vault
    category: knowledge
    status: available
    description: Search one configured external Markdown vault through a bounded foreground read that treats note content as untrusted context.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: application_envelope
    verifier: knowledge_vault_a0
  local.search:
    internal_handler: local_search
    category: knowledge
    status: available
    description: Search reviewed repository documentation, Knowledge Vault notes, and canonical Music and Visual project briefs in one bounded source-attributed foreground read.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: application_envelope
    verifier: local_search_a1
  knowledge.vault.initialize:
    internal_handler: knowledge_vault
    category: knowledge
    status: available
    description: Create the reviewed portable starter structure in one configured external Markdown vault without overwriting conflicting files.
    risk: write_local_state
    requires_approval: true
    confirmation_phrase: INITIALIZE_KNOWLEDGE_VAULT
    writes_files: true
    expected_output: application_envelope
    verifier: knowledge_vault_a0
  knowledge.vault.memory_export:
    internal_handler: knowledge_vault
    category: knowledge
    status: available
    description: Project approved canonical Soul memory into a clearly marked generated Markdown index without changing canonical memory.
    risk: write_local_state
    requires_approval: true
    confirmation_phrase: EXPORT_APPROVED_MEMORY_TO_VAULT
    writes_files: true
    expected_output: application_envelope
    verifier: knowledge_vault_a0
  knowledge.vault.memory_import:
    internal_handler: knowledge_vault
    category: knowledge
    status: available
    description: Import one explicitly selected bounded Markdown note as a candidate in Soul's existing shared memory ledger.
    risk: write_local_state
    requires_approval: true
    confirmation_phrase: IMPORT_VAULT_NOTE_AS_MEMORY_CANDIDATE
    writes_files: true
    expected_output: application_envelope
    verifier: knowledge_vault_a0
  knowledge.vault.reflect:
    internal_handler: knowledge_vault
    category: knowledge
    status: available
    description: Classify one explicit durable-knowledge candidate, report its correct canonical destination, and prepare an exact reviewed Markdown note or update only when it belongs in the Knowledge Vault.
    risk: write_local_state
    requires_approval: true
    confirmation_phrase: WRITE_KNOWLEDGE_VAULT_NOTE
    writes_files: true
    expected_output: application_envelope
    verifier: knowledge_vault_a1
  knowledge.vault.conversation_reflect:
    internal_handler: conversation_runtime
    category: knowledge
    status: available
    description: Explicitly inspect one bounded local conversation, draft one review-only reusable-knowledge candidate, and offer the existing exact Knowledge Vault write gate only when deterministic policy permits it.
    risk: write_local_state
    requires_approval: true
    confirmation_phrase: WRITE_KNOWLEDGE_VAULT_NOTE
    writes_files: true
    expected_output: conversation_result
    verifier: knowledge_reflection_a2
  downloads.inspect:
    path: Soul/skills/downloads/inspect.rb
    language: ruby
    description: Read-only Downloads inspection and cleanup-candidate planning.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: json
    verifier: schema_basic
  downloads.cleanup_plan:
    path: Soul/skills/downloads/plan.rb
    language: ruby
    description: Read-only human-oriented cleanup plan based on downloads.inspect.
    risk: read_only
    requires_approval: false
    writes_files: false
    expected_output: json
    verifier: schema_basic
  downloads.move_to_trash:
    path: Soul/skills/downloads/move_to_trash.rb
    language: ruby
    description: Approval-gated move-to-trash execution based on a verified downloads.cleanup_plan.
    risk: write_trash
    requires_approval: true
    confirmation_phrase: MOVE_TO_TRASH
    writes_files: true
    expected_output: json
    verifier: schema_basic
  downloads.restore_last_cleanup:
    path: Soul/skills/downloads/restore_last_cleanup.rb
    language: ruby
    description: Approval-gated restore of the latest successful Downloads cleanup
      from Trash.
    risk: write_file
    requires_approval: true
    confirmation_phrase: RESTORE_FROM_TRASH
    writes_files: true
    expected_output: json
    verifier: schema_basic
  weather.report:
    path: Soul/skills/weather/report.rb
    language: ruby
    description: Read-only weather report with temperature, humidity, air quality,
      and optional 3-day outlook.
    risk: read_only
    requires_approval: false
    writes_files: false
    network_access: true
    expected_output: json
    verifier: schema_basic
  web.research:
    path: Soul/skills/web/research.rb
    language: ruby
    description: Bounded foreground public-web search and HTTPS source retrieval with provenance and SSRF protection.
    risk: read_only_network
    requires_approval: false
    writes_files: false
    network_access: true
    expected_output: json
    verifier: schema_basic
  web.lookup:
    path: Soul/skills/web/lookup.rb
    language: ruby
    description: Bounded DuckDuckGo Instant Answer lookup for narrow orientation; not a general research backend.
    risk: read_only_network
    requires_approval: false
    writes_files: false
    network_access: true
    expected_output: json
    verifier: schema_basic
  cloud.providers.list:
    path: Soul/skills/cloud/providers/list.rb
    description: List configured cloud LLM providers without making network calls.
    risk: read_only
  cloud.providers.test:
    path: Soul/skills/cloud/providers/test.rb
    description: Run bounded smoke tests for configured cloud LLM providers.
    risk: read_only
  skill.brief.draft:
    path: Soul/skills/skill/brief/draft.rb
    description: Draft a review-only Soul/ skill proposal using a configured cloud
      provider.
    risk: read_only
  skill.brief.review:
    path: Soul/skills/skill/brief/review.rb
    description: Review a Soul/ skill proposal and write a review-only artifact.
    risk: read_only
  youtube.song_search:
    description: Open a YouTube search for a requested song in the default Linux browser
      after confirmation.
    path: Soul/skills/youtube/song_search.rb
    risk: low
  youtube.video_resolve:
    description: Resolve a song/search query to a YouTube video candidate using the
      official YouTube Data API.
    path: Soul/skills/youtube/video_resolve.rb
    risk: low
