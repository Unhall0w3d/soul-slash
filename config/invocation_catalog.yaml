---
schema_version: soul.invocation_catalog.v1
entries:
  - id: system-status
    label: System status
    category: Everyday
    summary: Inspect bounded current host and Soul runtime evidence.
    skill_ids: [system.status]
    required_inputs: []
    optional_inputs: [A narrower system area to explain after collection]
    core: Any Core
    approval: No approval for the read; deeper or mutating work remains separate.
    output: A dated evidence summary with explicit unavailable fields.
    boundary: Status collection does not authorize host mutation or infer uncollected health.
    examples:
      - Check the current system status.
  - id: weather
    label: Local weather
    category: Everyday
    summary: Retrieve a concise current weather report and optionally continue into a three-day outlook.
    skill_ids: [weather.report]
    required_inputs: []
    optional_inputs: [An explicit request for the three-day outlook]
    core: Any Core
    approval: No approval for this bounded read.
    output: Temperature, conditions, wind, humidity, air quality, and an offered outlook.
    boundary: A failed fetch does not become a model-memory weather claim.
    examples:
      - What does the weather look like?
  - id: security-status
    label: Security monitoring status
    category: Everyday
    summary: Collect a privacy-filtered Wazuh manager, agent, recent-alert, and adapted-posture summary through Chat or Voice Presence.
    skill_ids: [security.status]
    required_inputs: []
    optional_inputs: []
    core: Any conversational Core; the collection itself is deterministic and foreground.
    approval: No approval for this bounded read.
    output: A fresh, partial, or unavailable aggregate with manager and agent health, declared alert scope and severity counts, and an explicit ClamAV evidence limitation.
    boundary: Wazuh remains the investigation console; raw events, alert descriptions, acknowledgement, suppression, quarantine, scans, and remediation are unavailable.
    examples:
      - How does security look?
      - Are there recent security alerts?
  - id: fleet-observability-summary
    label: Fleet observability summary
    category: Everyday
    summary: Read one bounded endpoint, resource, storage, network, switch, alert, and boot projection from Observatory.
    skill_ids: [fleet.observability]
    required_inputs: [An explicit fleet-health or Observatory-status question]
    optional_inputs: []
    core: Any conversational Core; collection is deterministic, foreground, and read-only.
    approval: No approval for this bounded read.
    output: A privacy-filtered summary with explicit gaps and an owner-configured Grafana drill-down when available.
    boundary: Arbitrary PromQL, raw metrics, maintenance, reboot, switch mutation, alert mutation, notification, and remediation are unavailable.
    examples:
      - How does the fleet look?
      - Summarize fleet observability.
  - id: web-research
    label: Web research
    category: Knowledge
    summary: Search configured public sources in one bounded foreground research pass.
    skill_ids: [web.research]
    required_inputs: [Explicit research question or objective, One configured SearXNG or Brave search provider]
    optional_inputs: [Desired deliverable and one supported artifacts/ target, Up to three topics, Source constraints]
    core: Retrieval is deterministic and foreground; Daily Core provides source-grounded synthesis when available.
    approval: No approval for public read-only research.
    output: Provenance-bound source evidence and cited findings that can inform a response or enter the existing approval-gated artifact preview.
    boundary: Public HTTPS sources remain untrusted evidence; no private or authenticated fetch, arbitrary URL operation, memory promotion, action authority, retry loop, or background continuation.
    examples:
      - Research current Bash practices for this script and summarize the useful constraints.
  - id: knowledge-vault
    label: Knowledge Vault
    category: Knowledge
    summary: Search reviewed Markdown knowledge or prepare an explicit durable-knowledge candidate.
    skill_ids: [knowledge.vault.search, knowledge.vault.reflect]
    required_inputs: [A search query or one explicit knowledge candidate]
    optional_inputs: [Title, tags, source reference, or target note]
    core: Any Core for search; Daily Core may help draft a reflection.
    approval: Search is read-only; writing a reviewed note requires the exact write gate.
    output: Search matches or a visible candidate and exact write preview.
    boundary: Ordinary conversation is not silently promoted into durable knowledge.
    examples:
      - Search the Knowledge Vault for our local model migration notes.
  - id: local-search
    label: Local project and document search
    category: Knowledge
    summary: Search reviewed local documentation and canonical Music and Visual project briefs with source citations.
    skill_ids: [local.search]
    required_inputs: [A local search query]
    optional_inputs: [Repository, Knowledge Vault, Music, or Visual source filter]
    core: Any Core; retrieval is deterministic and local.
    approval: No approval for this bounded read.
    output: Ranked excerpts with source kind, canonical reference, digest, and freshness metadata.
    boundary: Search is limited to reviewed adapters, creates no index or memory, and never treats source text as authority.
    examples:
      - Search local projects and documents for backrooms visual prompts.
      - Search my music projects for liquid drum and bass.
      - Search my visual projects for backrooms.
  - id: files-inspect
    label: Approved local file inspection
    category: Knowledge
    summary: List one directory level, stat one path, or read one bounded text file beneath an explicitly configured approved root.
    skill_ids: [files.inspect]
    required_inputs: [Exact approved root ID, operation, and relative path]
    optional_inputs: [List the configured root IDs before selecting one]
    core: Any Core; inspection is deterministic and local.
    approval: No approval for this bounded read; configuration alone defines root authority.
    output: Bounded directory metadata, exact path metadata, or UTF-8 text with digest and untrusted-content labeling.
    boundary: Conversation cannot add roots; absolute paths, traversal, hidden paths, secret-bearing files, symlinks, binary files, oversized files, writes, recursion, indexing, and background continuation are unavailable.
    examples:
      - Show approved file roots.
      - List files in root project at docs.
      - Read file from root project at README.md.
  - id: network-diagnose
    label: Bounded network diagnosis
    category: Knowledge
    summary: Inspect local network evidence or run one exact-target DNS, reachability, or TCP socket check.
    skill_ids: [network.diagnose]
    required_inputs: [Explicit diagnostic operation]
    optional_inputs: [One exact hostname or IP literal; one exact TCP port for socket checks]
    core: Any Core; diagnosis is deterministic and foreground.
    approval: No approval for these bounded reads.
    output: Point-in-time local address and route evidence, DNS addresses, one reachability result, or one zero-payload TCP connection result.
    boundary: No subnet or port scan, range, wildcard, multiple targets, URL fetch, traceroute, packet capture, retry, monitoring, privilege, or configuration mutation.
    examples:
      - Diagnose local network.
      - Resolve example.com.
      - Check reachability to 192.0.2.10.
      - Check socket example.com port 443.
  - id: repository-inspect
    label: Approved repository inspection
    category: Knowledge
    summary: Inspect bounded branch, HEAD, status, recent commit, staged diff, and working-tree diff evidence from one configured Git repository.
    skill_ids: [repository.inspect]
    required_inputs: [Exact approved repository root ID]
    optional_inputs: [List configured repository IDs before selecting one]
    core: Any Core; inspection is deterministic and local.
    approval: No approval for this bounded read; configuration alone defines repository authority.
    output: Point-in-time Git evidence with omission, withholding, truncation, and untrusted-content labels.
    boundary: Conversation cannot enroll repositories; arbitrary paths, Git mutation, network Git operations, hooks, secret-shaped paths, credential content, memory writes, and background continuation are unavailable.
    examples:
      - Show approved repository roots.
      - Inspect repository root project.
  - id: artifact-compose
    label: Bounded artifact composition
    category: Workspace
    summary: Draft or revise one reviewed Markdown, plain-text, or JSON deliverable in Soul's shared workspace.
    skill_ids: [workspace.artifact.compose]
    required_inputs: [Explicit substantial text deliverable requirements, One new project-relative artifacts/ target ending in .md .txt or .json]
    optional_inputs: [Project public or local_private privacy, One attached source artifact ID and new target for revision, Retained research grounding]
    core: Daily Core with one configured local-only or local-network drafting provider.
    approval: Preview is non-mutating; exact create artifact token confirm authorizes one digest-bound write. Exact cancellation remains available.
    output: One verified canonical artifact attached to the active conversation and delivered to the shared workspace inbox, with digest and lineage evidence.
    boundary: No cloud drafting, overwrite, arbitrary path, direct edit, code or executable, rich document, media, archive, multi-file package, publication, automatic retry, or background continuation.
    examples:
      - Create a project report at artifacts/status.md covering the reviewed findings.
      - Can you revise artifact art_example into artifacts/status-v2.md with project privacy?
  - id: picture-and-screen
    label: Picture and screen understanding
    category: Perception
    summary: Inspect one supplied picture, one explicit fresh screen capture, or an existing Studio candidate.
    handler_id: picture_understanding
    required_inputs: [A picture plus question, an explicit capture target, or an exact project/candidate reference]
    optional_inputs: [Current window, left monitor, right monitor, selected region, or archive context]
    core: Daily Core
    approval: The explicit attachment or one-shot capture request is the consent boundary.
    output: A grounded visual description with ephemeral pixels by default.
    boundary: No background watching, periodic capture, screen control, or authority from pixels.
    examples:
      - Describe what is currently visible on my right monitor.
  - id: music-production
    label: Music production
    category: Creative
    summary: Gather a song brief, draft missing optional choices, generate, review, revise, and export a kept result.
    skill_ids: [creative.music_production]
    required_inputs: [Intent, supported duration, vocal or instrumental mode, rights status]
    optional_inputs: [Title, BPM, key, meter, seed, Sound and Structure, lyrics]
    core: Music Core for ACE-Step generation
    approval: Exact action click authorizes each Core transition, generation, revision, disposition, or export gate.
    output: Authenticated audio candidates, analysis evidence, revisions, and reviewed exports.
    boundary: Conversation never substitutes for candidate review or disposition.
    examples:
      - Help me create a 180-second instrumental liquid drum and bass track.
  - id: visual-production
    label: Visual production
    category: Creative
    summary: Gather a visual brief, generate and revise a still, or continue reviewed context into native motion.
    skill_ids: [creative.visual_production]
    required_inputs: [A clear visual intent]
    optional_inputs: [Title, aspect, scene direction, exclusions, seed, motion duration]
    core: AMD-Free Core for local still and native-motion generation
    approval: Exact action click authorizes Core transition and each bounded render.
    output: Authenticated still or motion candidates retained in Visual Studio.
    boundary: Motion review, binding, destructive visual actions, and publication retain their owning gates.
    examples:
      - Create a landscape visual of an empty machine cathedral suspended over dark water.
  - id: companion-production
    label: Music and visual companion
    category: Creative
    summary: Coordinate reviewed music and visual candidates into a bounded companion and local upload package.
    skill_ids: [creative.companion_production]
    required_inputs: [Exact music project or candidate and exact visual project or candidate]
    optional_inputs: [Static presentation or reviewed generated motion]
    core: Dynamic; Soul must explain and gate any required transition.
    approval: Binding, rendering, export, and packaging are separate exact actions.
    output: A full-duration local companion and optional exact upload package.
    boundary: External publication and YouTube account actions remain outside this invocation.
    examples:
      - Pair my kept Afterimage Current song with its kept visual and prepare a local upload package.
  - id: core-control
    label: Core control
    category: Runtime
    summary: Inspect or transition among configured Cores without rebooting.
    skill_ids: [cores.activate]
    required_inputs: [Exact target Core]
    optional_inputs: []
    core: The currently active Core performs the preview.
    approval: Only the exact server-authored action click authorizes the transition.
    output: Active-work check, transition preview, and resulting runtime state.
    boundary: Ordinary discussion and downstream intent never silently switch Cores.
    examples:
      - Switch to Music Core.
  - id: project-timeline
    label: Project Timeline
    category: Project
    summary: Inspect the implementation ledger or explicitly revise one item.
    skill_ids: [project.timeline.inspect, project.timeline.update]
    required_inputs: [Exact item or unmistakable timeline request]
    optional_inputs: [Status, notes, implementation, technologies, interfaces, commands, or references]
    core: Any Core
    approval: Read and explicit owner-local edits do not require a second gate; revision matching prevents stale writes.
    output: Current tracker state or one updated item.
    boundary: Tracker state is planning evidence, not merge, release, or execution authority.
    examples:
      - Show the project timeline.
  - id: skill-studio-inspection
    label: Skill Studio inspection
    category: Project
    summary: Inspect current proposal stages, Beta evidence, and production skill inventory without crossing either human gate.
    skill_ids: [skill_studio.inspect]
    required_inputs: []
    optional_inputs: [Proposal ID or exact title, Beta skill ID, or proposal/Beta/production inventory filter]
    core: Any Core; the projection is deterministic and local.
    approval: No approval for inspection; every build, trial, approval, promotion, closeout, and deletion remains an exact Skill Studio action.
    output: Current proposal, Beta, stage, and production registry evidence.
    boundary: Conversational inspection never prepares or executes a Skill Studio mutation and never treats model output as authority.
    examples:
      - Show the Skill Studio inventory.
  - id: conversation-management
    label: Conversation management
    category: Administration
    summary: Archive conversations from the active list or permanently delete selected local transmissions.
    skill_ids: [chats.clear, chats.forget]
    required_inputs: [Exact title, selected conversations, or an explicit all-conversations scope]
    optional_inputs: [Archive-only or permanent-forget intent]
    core: Any Core
    approval: Preview plus exact destructive action is required.
    output: An inventory preview followed by an archive or deletion receipt.
    boundary: Archive preserves transcripts; permanent forget is destructive and separately labeled.
    examples:
      - Preview archiving the selected conversations.
  - id: downloads-cleanup
    label: Downloads cleanup
    category: Administration
    summary: Inspect Downloads, prepare a cleanup plan, move reviewed candidates to Trash, or restore the latest cleanup.
    skill_ids: [downloads.inspect, downloads.cleanup_plan, downloads.move_to_trash, downloads.restore_last_cleanup]
    required_inputs: [An explicit inspection, plan, move, or restore request]
    optional_inputs: [Candidate constraints]
    core: Any Core
    approval: Inspection and planning are read-only; move and restore require exact approval.
    output: Evidence, plan, Trash receipt, or restore receipt.
    boundary: Files are never permanently deleted by this workflow.
    examples:
      - Inspect my Downloads folder and prepare a cleanup plan.
  - id: device-maintenance
    label: Device maintenance
    category: Administration
    summary: Preview and run one fixed package-maintenance or reboot adapter against one exact managed device.
    skill_ids: [maintenance.device]
    required_inputs: [An explicit maintenance request and exact managed device]
    optional_inputs: []
    core: Any Core; routing and authority are deterministic and model-independent.
    approval: One short-lived conversational confirmation may authorize routine package maintenance or a separately prepared reboot on a non-workstation device.
    output: Live progress, a device-scoped maintenance or reboot receipt, refreshed fleet evidence, remaining updates, reboot state, and any bounded failure.
    boundary: Workstation maintenance and reboot, deletion, credentials, and other protected actions require an Operator-controlled Dashboard, terminal, or Noctalia gesture; non-workstation reboot remains separate from maintenance and never chains automatically.
    examples:
      - Run maintenance on Crucible.
      - Reboot Crucible.

  - id: cpu-assistance-requests
    label: CPU member assistance requests
    category: Supported requests
    summary: In a new conversation select the Gemma CPU member preset, then request one named GPU member's bounded analysis or draft. Review the displayed member and exact request before replying yes in the same conversation.
    handler_id: cpu_member_assistance_gateway
    required_inputs: [A CPU member conversation, Exact member and task text of 1 to 1800 bytes]
    optional_inputs: [GPT-OSS or GPT-OSS 20b, Gemma or Gemma 26b, Qwen]
    core: CPU member preset; GPU work still requires separate compute admission.
    approval: The first request shows a proposal only. Reply yes immediately after that proposal to save one confirmed queue task; confirmation without a preceding proposal saves nothing.
    output: A scoped proposal followed by a retained task ID after confirmation; one attempt when compute permits.
    boundary: Closed request forms such as Ask MEMBER to TASK are supported; unrestricted natural-language task routing is not promised. No new execution permissions, automatic retry, or change to Compute Availability.
    examples:
      - Ask GPT-OSS to summarize these supplied notes.
      - Have Gemma review this supplied paragraph.
      - Use Qwen to draft a short outline from these supplied points.
      - yes
  - id: cpu-queue-requests
    label: CPU compute and queue requests
    category: Supported requests
    summary: Inspect GPU availability, confirmed queued tasks, and retained results, or cancel one exact queued task from a CPU member conversation.
    handler_id: cpu_member_assistance_gateway
    required_inputs: [A CPU member conversation, A full returned task ID for result or cancellation requests]
    optional_inputs: []
    core: CPU member preset in a new conversation.
    approval: Inspection needs no task confirmation. An explicit cancellation targets only the named task.
    output: Compute Availability evidence, queued task states, retained result when present, or a cancellation receipt.
    boundary: Availability evidence does not reserve compute or bypass admission. Replace the example ID with the actual returned t- plus 24 lowercase hexadecimal characters. Queue requests differ from explicit /task ledger commands.
    examples:
      - Check compute availability
      - Show my queue
      - Show result for t-0123456789abcdef01234567
      - Cancel queued task t-0123456789abcdef01234567
  - id: cpu-calculation-requests
    label: CPU whole-number calculation requests
    category: Supported requests
    summary: Calculate one addition, subtraction, or multiplication from two whole numbers written in the current message using the supported complete-sentence forms.
    handler_id: cpu_member_assistance_gateway
    required_inputs: [A CPU member conversation, Two explicit whole numbers each between -1000000 and 1000000]
    optional_inputs: ["Forms: A plus B; A minus B; A times B; A multiplied by B", "Forms: add A and B; add A to B; subtract A from B; multiply A by B", "Optional please and what is or calculate prefixes for A operator B"]
    core: CPU member preset; deterministic calculation invokes no model.
    approval: No confirmation for this bounded calculation.
    output: The exact operands, operation, and result, or a request for a supported calculation.
    boundary: No division, decimals, multi-step expressions, or numbers recalled from prior turns. Credit and budget remainder forms require nonnegative amounts. The entire message must match; quoted snippets and extra instructions are not extracted.
    examples:
      - What is 847 minus 286?
      - Multiply 4 by 5
      - I have 100 credits and spent 25 credits, how much is left?
      - My budget is 100 and my deposit is 25, what is the remaining balance?
  - id: cpu-calculation-command
    label: /calculate command
    category: Commands
    summary: Supply explicit typed JSON for one bounded whole-number addition, subtraction, or multiplication in a CPU member conversation.
    handler_id: cpu_member_calculation_gateway
    required_inputs: ["Exact JSON fields: operation, sources, left, right", "operation is add, subtract, or multiply; sources has exactly two named integers from -1000000 to 1000000", "left and right name entries in sources; source names start with a letter and contain at most 32 letters, digits, underscores, or hyphens"]
    optional_inputs: []
    core: CPU member preset in a new conversation; calculation invokes no model.
    approval: The literal user command supplies the operands; no confirmation required.
    output: Deterministic calculation evidence and result.
    boundary: Maximum command size is 2048 bytes. No duplicate or extra JSON fields, expression evaluation, division, decimals, or implicit operands from memory. Documentation examples do not execute.
    examples:
      - '/calculate {"operation":"subtract","sources":{"budget":100,"deposit":25},"left":"budget","right":"deposit"}'
  - id: cpu-task-commands
    label: /task commands
    category: Commands
    summary: Use explicit typed task-ledger commands to add, list, preview, run, or cancel one task. This ledger is separate from the prose confirmed queue.
    handler_id: cpu_member_handoff_gateway
    required_inputs: [A CPU member conversation, Exact JSON fields for the chosen command, A returned task ID and preview expected_digest for run]
    optional_inputs: ["/task help; /task list; /task list {\"cursor\":\"t-...\"}", "/task cancel {\"task_id\":\"t-...\"}"]
    core: CPU member preset in a new conversation; supported GPU member and resource admission required for run.
    approval: Add records a pending task only. Review preview contents and target before an explicit run with its exact expected_digest; yes does not run a /task ledger task.
    output: Task ledger, digest-bound preview, or one foreground attempt and retained run receipt.
    boundary: Maximum command size is 4096 bytes; exact fields and no duplicate JSON keys. Replace task IDs with returned t- plus 24 lowercase hex characters and digest with 64 lowercase hex characters. No automatic dispatch or retry; use Stop for active work and a new conversation after cancellation.
    examples:
      - '/task help'
      - '/task add {"title":"Review","detail":"Summarize these supplied notes","member":"gpt-oss-20b"}'
      - '/task preview {"task_id":"t-0123456789abcdef01234567"}'
      - '/task run {"task_id":"t-0123456789abcdef01234567","expected_digest":"REPLACE_WITH_EXACT_PREVIEW_DIGEST"}'
  - id: cpu-approved-memory
    label: CPU approved memory questions
    category: Supported requests
    summary: In a new Soul — Gemma CPU conversation, ordinary questions can use relevant approved shared memories and memories scoped to this CPU member.
    handler_id: cpu_member_memory_gateway
    skill_ids: []
    required_inputs: [A question about a remembered fact or preference]
    optional_inputs: []
    core: Soul — Gemma CPU; new memory-enabled conversations only.
    approval: Reads existing approved scopes only. This does not approve, share, save or modify a memory.
    output: A model answer using a bounded selection of approved reference records, or an acknowledgement that the information is absent.
    boundary: Prose is not an exact command here. Retrieval is relevance-ranked and bounded; other-member and unscoped records are excluded. Memory cannot authorize a tool or queued task. Old conversations keep their original memory policy.
    examples:
      - What do you remember about my restore preferences?
      - Do you have an approved memory of my preferred location?
  - id: cpu-operational-guide
    label: CPU invocation guide requests
    category: Supported requests
    summary: Show the invocation guide or its commands and supported prose from a new Soul — Gemma CPU conversation.
    handler_id: cpu_member_operations_gateway
    required_inputs: [An explicit guide request]
    optional_inputs: [Ask how to invoke one named capability]
    core: Soul — Gemma CPU; new A8 conversations. No inference is needed.
    approval: Read-only documentation. Examples do not execute or authorize operations.
    output: Curated syntax, inputs and approval boundaries; registered capabilities are not all connected to this member.
    boundary: No raw skill file access or arbitrary file lookup. Old conversations retain their bound behavior.
    examples: [Show commands, Show supported requests, How can I invoke /task commands?]
  - id: cpu-security-status
    label: CPU security status requests
    category: Supported requests
    summary: Collect the existing aggregate Wazuh manager, agent, alert and posture evidence without loading a model.
    handler_id: cpu_member_operations_gateway
    required_inputs: [An explicit security status request]
    optional_inputs: []
    core: Soul — Gemma CPU; new A8 conversations.
    approval: No confirmation for the aggregate read. Existing private status caches may refresh; remediation remains separate.
    output: Bounded security summary with its timestamp, missing evidence and recorded attribution.
    boundary: No raw alert events, credentials, scans, remote changes or remediation. ClamAV freshness is not collected. Replaying a saved reply does not refresh the source; send a new request for a new check.
    examples: [Security status, Check security status, Show security status]
  - id: cpu-fleet-status
    label: CPU fleet status requests
    category: Supported requests
    summary: Collect the existing bounded Observatory summary of endpoint, resource, network and alert evidence without loading a model.
    handler_id: cpu_member_operations_gateway
    required_inputs: [An explicit fleet status request]
    optional_inputs: []
    core: Soul — Gemma CPU; new A8 conversations.
    approval: Read-only foreground collection through the existing Observatory access. Maintenance and reboot remain separate.
    output: Bounded fleet summary with collection time and gaps; missing evidence is not healthy evidence.
    boundary: No caller-selected host, query, command or path. No remote mutation. Replaying a saved reply does not recollect; send a new request for a new check.
    examples: [Fleet status, Check fleet status, Fleet observability]
  - id: cpu-creative-preview
    label: Creative Studio preview requests
    category: Supported requests
    summary: Gather an image or song brief in a new Soul — Gemma CPU conversation, inspect every proposed value, revise it, or cancel the preview.
    handler_id: cpu_member_creative_preview_gateway
    required_inputs: [Explicit image or song intent, "Songs also need Duration: (30–300 whole seconds or exactly 600), Mode: (vocal or instrumental), and Rights: (original, licensed or public_domain)"]
    optional_inputs: ["Title:, Intent:, Frame:, Prompt:, Exclusions:, Seed: for images", "Title:, Sound:, Lyrics:, BPM:, Key:, Meter:, Seed: for songs; one field per line"]
    core: New Soul — Gemma CPU conversations. Preview needs no model inference or GPU allocation.
    approval: Preview is task state only. Yes does not approve or queue generation. The existing exact Studio approval and compute handoff remain required for the later execution step.
    output: A source-bound brief with visible supplied/proposed values, selected Studio profile, compute snapshot and preview digest, or one question for a required choice.
    boundary: Preview does not create a native Studio project, render, publish, reserve compute or approve memory. Use the separate exact native execution commands after reviewing the brief. Inspecting or replaying a preview does not refresh its compute/configuration snapshot; revising it does.
    examples:
      - 'Preview an image: A blue bowl on a wooden table'
      - "Preview a song: Quiet synth music for an imaginary library\nDuration: 90 seconds\nMode: instrumental\nRights: original"
      - "Frame: portrait\nSeed: 0"
      - 'Show creative preview; or send Cancel creative preview as its own message.'

  - id: cpu-creative-execution
    label: Native Studio creation and generation
    category: Supported requests
    summary: Create a reviewed native Studio project, approve one exact generation attempt, and inspect or cancel it through LibreChat.
    handler_id: cpu_member_creative_execution_gateway
    required_inputs: [A current ready creative brief, Its exact preview digest, A separate exact native approval digest to render]
    optional_inputs: [Status or cancellation using the creative receipt ID]
    core: Sequential shared GPU compute handoff; CPU controls require no inference. Uses the existing bounded dashboard job runner.
    approval: Prepare creative generation DIGEST creates only the reviewed native project. Generate creative DIGEST approves the shown native candidate and compute handoff. A bare yes never executes. Human review remains required afterward.
    output: Native project and candidate IDs, bounded execution receipt, and authenticated image or MP3/FLAC review links when complete. Send Creative status ID to retrieve the result.
    boundary: No automatic retry or restart, arbitrary paths, export, publication, candidate promotion or memory approval. Cancel requests owned-process shutdown; a cancellation request alone does not establish cleanup. Existing conversations retain their original capabilities; use a new CPU conversation.
    examples:
      - 'Prepare creative generation PREVIEW_DIGEST (replace with the exact 64-character digest shown)'
      - 'Generate creative APPROVAL_DIGEST (replace with the native action digest shown)'
      - 'Creative status RECEIPT_ID'
      - 'Cancel creative generation RECEIPT_ID'

  - id: cpu-weather-requests
    label: CPU weather requests
    category: Supported requests
    summary: Retrieve current conditions for an explicitly named public city through the existing weather service.
    handler_id: cpu_member_reference_gateway
    required_inputs: [A new CPU conversation, An explicit city or previously configured weather location]
    optional_inputs: []
    core: CPU deterministic reference route; no model or GPU inference.
    approval: The current explicit request permits one bounded public read.
    output: Current weather or an honest missing-location or fetch failure, with source attribution.
    boundary: Weather is not inferred from memory. No private context is added to the location query.
    examples:
      - Weather in Toronto
      - Weather
  - id: cpu-web-reference-requests
    label: CPU public research and lookup
    category: Supported requests
    summary: Perform one configured public research pass or a distinct narrow public instant-answer lookup.
    handler_id: cpu_member_reference_gateway
    required_inputs: [A new CPU conversation, An explicit public question or topic]
    optional_inputs: [Existing configured research provider for Research]
    core: CPU deterministic reference route; no model or GPU inference.
    approval: The current explicit public-topic request permits the bounded lookup or research pass.
    output: Untrusted source evidence with provenance, excerpts and declared limits, or an unavailable-provider result.
    boundary: No arbitrary URL fetching, private source/context forwarding, automatic synthesis, new provider configuration, memory approval or action authority.
    examples:
      - 'Research: Ruby syntax tree parser documentation'
      - 'Lookup: Ruby programming language'
